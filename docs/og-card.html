<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px}
  body{
    background:#0A0D14;
    font-family:'Inter',-apple-system,sans-serif;
    color:#E8ECF0;position:relative;overflow:hidden;
  }
  .dots{
    position:absolute;inset:0;
    background-image:radial-gradient(rgba(33,208,195,.22) 1.4px,transparent 1.4px);
    background-size:38px 38px;
    mask-image:radial-gradient(ellipse 70% 90% at 22% 50%,#000 20%,transparent 78%);
    -webkit-mask-image:radial-gradient(ellipse 70% 90% at 22% 50%,#000 20%,transparent 78%);
  }
  .glow{
    position:absolute;width:620px;height:620px;border-radius:50%;
    background:radial-gradient(circle,rgba(27,103,198,.30),transparent 66%);
    top:-230px;left:-160px;filter:blur(30px);
  }
  .photo{
    position:absolute;top:0;right:0;width:452px;height:630px;
  }
  .photo img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block}
  .photo::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(90deg,#0A0D14 0%,rgba(10,13,20,.82) 18%,rgba(10,13,20,.10) 52%,transparent 100%);
  }
  .wrap{position:absolute;z-index:3;left:80px;top:50%;transform:translateY(-50%);width:690px}
  .badge{
    display:inline-flex;align-items:center;gap:9px;
    border:1px solid rgba(255,255,255,.10);border-radius:999px;
    padding:9px 18px;font-size:20px;color:#8A97A8;background:rgba(20,26,38,.6);
  }
  .badge .pin{width:8px;height:8px;border-radius:50%;background:#21D0C3;box-shadow:0 0 12px #21D0C3}
  .name{
    margin-top:26px;font-size:66px;font-weight:600;letter-spacing:-2px;line-height:1.04;
  }
  .role{
    margin-top:16px;font-size:31px;font-weight:400;line-height:1.35;color:#8A97A8;
  }
  .role b{
    font-weight:600;
    background:linear-gradient(135deg,#21D0C3,#1B67C6);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .rule{margin-top:34px;width:96px;height:3px;border-radius:2px;background:linear-gradient(135deg,#21D0C3,#1B67C6)}
  .foot{
    position:absolute;left:80px;bottom:52px;z-index:3;
    font-family:'JetBrains Mono',ui-monospace,monospace;
    font-size:21px;color:#8A97A8;letter-spacing:.3px;
  }
  .foot .u{color:#21D0C3}
</style></head>
<body>
  <div class="glow"></div>
  <div class="dots"></div>
  <div class="photo"><img src="../assets/hero-photo.jpg" alt=""></div>
  <div class="wrap">
    <span class="badge"><span class="pin"></span> Dubai, UAE</span>
    <div class="name">Andres Bolivar</div>
    <div class="role">Engineer &amp; entrepreneur building <b>secure, private systems</b> for real-world environments.</div>
    <div class="rule"></div>
  </div>
  <div class="foot"><span class="u">andresbolivar.me</span></div>
</body></html>
